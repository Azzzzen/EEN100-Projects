[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-project"
version = "0.1.0"
description = "Shared SBM and spectral clustering baseline for EEN100 Project 1"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "matplotlib>=3.8", "threadpoolctl>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]
